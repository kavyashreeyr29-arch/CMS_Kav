name: elevatohub

services:
  postgres:
    image: postgres:16-alpine
    container_name: elevatohub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elevatohub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elevatohub}
      POSTGRES_DB: ${POSTGRES_DB:-elevatohub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elevatohub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: elevatohub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: elevatohub-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - postgres

  # S3-compatible object storage for ticket attachments and project
  # documents (lld.md §1). Backend's StorageService talks to this via the
  # AWS SDK — same code path would work against real S3 in production, just
  # swap S3_ENDPOINT/credentials.
  minio:
    image: minio/minio:latest
    container_name: elevatohub-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-elevatohub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-elevatohub123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init container: creates the attachments bucket on first run.
  # MinIO doesn't auto-create buckets, and doing it lazily from the backend
  # on every request is wasteful — do it once here instead.
  minio-init:
    image: minio/mc:latest
    container_name: elevatohub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-elevatohub} ${MINIO_ROOT_PASSWORD:-elevatohub123} &&
      mc mb --ignore-existing local/${S3_BUCKET:-elevatohub-attachments}
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: elevatohub-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # A Neon DATABASE_URL from the root .env takes precedence. Without one,
      # retain the local Docker Postgres default.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-elevatohub}:${POSTGRES_PASSWORD:-elevatohub}@postgres:5432/${POSTGRES_DB:-elevatohub}?schema=public}
      REDIS_URL: redis://redis:6379
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
      AWS_REGION: ${AWS_REGION:-}
      # Deliberately the browser-reachable address, not the internal
      # `minio:9000` Docker DNS name — the backend never moves file bytes
      # itself, it only *signs* URLs that the browser then PUTs/GETs
      # directly against MinIO, so the signed host must be one the browser
      # can resolve.
      S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-elevatohub}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-elevatohub123}
      S3_BUCKET: ${S3_BUCKET:-elevatohub-attachments}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: sh -c "npx prisma db push && npx prisma db execute --file prisma/sql/active_timer_constraint.sql && npm run start:dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: elevatohub-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "npm run dev -- --host 0.0.0.0"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  backend-node-modules:
  frontend-node-modules:
