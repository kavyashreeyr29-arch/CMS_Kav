services:
  - type: web
    name: elevatohub-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run db:push && npm run seed && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_ENCRYPTION_KEY
        sync: false
      - key: EMAIL_INTAKE_SECRET
        sync: false
